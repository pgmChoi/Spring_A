<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <meta charset="UTF-8">
    <title>나야</title>
    <script src="http://localhost:35729/livereload.js?snipver=1"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<div layout:fragment="content" class="container my-3">

    <h1>질문 리스트</h1>

    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성일시</th>
        </tr>
        </thead>

        <tbody>
        <!-- 컨트롤러에서 넘긴 이름이 "paging"이므로 ${paging}으로 받음 -->
        <tr th:each="question, loop : ${paging}">
            <!-- 게시물 번호 역순 계산 -->
            <td th:text="${paging.getTotalElements - (paging.number * paging.size) - loop.index}"></td>

            <td>
                <a th:href="@{|/question/${question.id}|}"
                   th:text="${question.subject}">게시글 제목</a>
            </td>

            <td th:text="${#temporals.format(question.created, 'yyyy-MM-dd HH:mm')}">
                2026-06-07
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 페이징 처리 시작 -->
    <div th:if="${!paging.isEmpty()}">
        <ul class="pagination justify-content-center">
            <!-- 이전 버튼 -->
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number-1}|}">
                    <span>이전</span>
                </a>
            </li>

            <!-- 페이지 번호 버튼 (현재 페이지 기준 좌우 5개씩만 표시) -->
            <li th:each="page: ${#numbers.sequence(0, paging.totalPages-1)}"
                th:if="${page >= paging.number-5 and page <= paging.number+5}"
                th:classappend="${page == paging.number} ? 'active'"
                class="page-item">
                <a th:text="${page + 1}" class="page-link" th:href="@{|?page=${page}|}"></a>
            </li>

            <!-- 다음 버튼 -->
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number+1}|}">
                    <span>다음</span>
                </a>
            </li>
        </ul>
    </div>
    <!-- 페이징 처리 끝 -->

    <a th:href="@{/question/create}" class="btn btn-primary">질문 등록</a>
</div>
</html>
