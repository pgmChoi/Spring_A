<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <meta charset="UTF-8">
    <title>나야</title>
    <script src="http://localhost:35729/livereload.js?snipver=1"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<div layout:fragment="content" class="container my-3">

    <h1>질문 리스트</h1>

    <table>
        <thead>
        <tr>
            <th>제목</th>
            <th>작성일시</th>

        </tr>
        </thead>

        <tbody>
        <!-- postList를 순회하며 tr 태그 반복 생성 -->
        <tr th:each="question : ${list}">

            <td>
                <a th:href="@{|/question/${question.id}|}"
                   th:text="${question.subject}">게시글 제목</a>  <!-- | | 사이 변수처리 해줌-->
            </td>

            <!-- created(LocalDateTime)를 년-월-일만 출력 -->
            <td th:text="${#temporals.format(question.created, 'yyyy-MM-dd-HH:mm')}">
                2026-06-07
            </td>

        </tr>
        </tbody>
    </table>

    <a th:href="@{/question/create}" class="btn btn-primary">질문 등록</a>
</div>
</html>
